services:
  - type: web
    name: taskpesa-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskpesa-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: taskpesa-db
